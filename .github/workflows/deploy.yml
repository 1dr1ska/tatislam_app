name: Deploy Flutter Web to Yandex Object Storage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          aws-region: ru-central1

      - name: Upload to Yandex Object Storage
        run: |
          aws s3 sync build/web s3://${{ secrets.YANDEX_BUCKET }} \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete